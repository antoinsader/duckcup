name: CI

on:
  push:
    branches: [main, publish]
  pull_request:
    branches: [main]

jobs:

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Download spaCy model
        run: python -m spacy download en_core_web_md
      - name: Run tests
        working-directory: backend
        # Exit code 5 = no tests collected (empty suite) — treat as success until tests are added
        run: pytest tests/ -v --ignore=tests/testing_scripts; [ $? -eq 0 ] || [ $? -eq 5 ]
        env:
          IS_PROD: "False"
          TESTING: "True"
          DATABASE_URL: "sqlite:///./data/test_db.db"
          JWT_SECRET_KEY: "ci_test_secret"
          SPECIAL_PASSWORD: "ci_test_pwd"
          BACKEND_SECRETS_ENCRYPTION_KEY: ${{ secrets.TEST_ENC_KEY }}

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_BASE_URL: /api/
          REACT_APP_LOGIN_GOOGLE_ROUTE: /api/auth/login_google
          REACT_APP_FRONT_END_NAME: DuckCup

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Copy compose file
        run: cp docker-compose.example.yml docker-compose.yml
      - name: Build images
        run: docker compose build
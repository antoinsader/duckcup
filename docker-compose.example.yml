# The "version" field is optional in Docker Compose v2+ (docker compose, not docker-compose).
# It's kept here for compatibility with older tooling. Safe to remove if using Docker Desktop 4+.
services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL (place fullchain.pem and privkey.pem in ./nginx/certs/):
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - app

  backend:
    build: ./backend
    # No host ports — accessed only through nginx on port 80
    volumes:
      # Persists database, datasets, RSA keys, and auto-generated secrets across restarts
      - ./data:/app/data
      # Persists log files across restarts
      - ./logs:/app/logs
    environment:

      # ── Required: Google OAuth (for Gmail connection) ──────────────────────
      # Follow the setup guide: backend/README.md#setup-google-for-gmail-connection
      - GOOGLE_CLIENT_ID=your_google_client_id_here
      - GOOGLE_CLIENT_SECRET=your_google_client_secret_here

      # ── Auto-generated on first run (do not set manually) ─────────────────
      # JWT_SECRET_KEY, SPECIAL_PASSWORD, BACKEND_SECRETS_ENCRYPTION_KEY
      # are generated automatically and saved in ./data/.secrets

      # ── Must match your deployment domain ─────────────────────────────────
      # All traffic goes through nginx (:80), so URIs no longer reference port 8000
      - GOOGLE_REDIRECT_URI=http://localhost/api/auth/google_callback
      - FRONTEND_URL=http://localhost/

      # ── Infrastructure (safe to leave as-is) ──────────────────────────────
      - IS_PROD=True
      - PORT=8000
      - HOST=0.0.0.0
      - SSL_PROTECTED=False
      - TESTING=False
      - ALLOWED_PROD_USER_DS_NUM=3
      - DATABASE_URL=sqlite:///./data/email_app_db.db
      - USER_DATASETS_CONTENT_DIR=./data/users_datasets/
      - TEMP_KEYS_DB_PATH=./data/temp_keys.db

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      # REACT_APP_* vars are baked into the JS bundle at build time (not runtime).
      # Override these args if deploying to a domain other than localhost.
      args:
        # ? I am doing here and in the front-end Dockerfile, do we need both? or just one of them is enough?
        - REACT_APP_API_BASE_URL=/api/
        - REACT_APP_LOGIN_GOOGLE_ROUTE=/api/auth/login_google
        - REACT_APP_FRONT_END_NAME=DuckCup
    # No host ports — accessed only through nginx on port 80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - app

networks:
  app:
    driver: bridge
  # infra:          ← uncomment when adding a postgres/redis service
  #   driver: bridge